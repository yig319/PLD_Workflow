[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pld-workflow"
version = "0.1.0"
description = "PLD recorder, plume manager, visualizer, and optional analysis helpers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyQt5>=5.15.6,<6",
]

[project.scripts]
pld-parameter-form = "pld_workflow.apps.parameter_form:main"
pld-plume-manager = "pld_workflow.apps.plume_manager:main"
pld-xrd-visualizer = "pld_workflow.apps.xrd_visualizer:main"
pld-afm-pfm-visualizer = "pld_workflow.apps.afm_pfm_visualizer:main"
pld-rheed-imm-visualizer = "pld_workflow.apps.rheed_imm_visualizer:main"
pld-raw-visualizer = "pld_workflow.apps.xrd_visualizer:main"
pld-afm-visualizer = "pld_workflow.apps.afm_pfm_visualizer:main"

[project.optional-dependencies]
analysis = [
  "h5py",
  "hvplot",
  "matplotlib>=3.5",
  "numpy>=1.21",
  "pandas>=1.3",
  "scikit-image",
  "seaborn",
]
visualization = [
  "AFM-tools>=2.1.0",
  "matplotlib>=3.5",
  "XRD-utils",
  "xrayutilities",
]
build = [
  "pyinstaller>=6.0",
]
docs = [
  "sphinx>=7.0",
  "pydata-sphinx-theme",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pld_workflow*"]
